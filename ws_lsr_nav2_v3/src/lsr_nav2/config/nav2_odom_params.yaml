bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 14.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 30.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.35

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.45
      min_approach_linear_velocity: 0.24
      lookahead_dist: 0.70
      min_lookahead_dist: 0.35
      max_lookahead_dist: 1.40
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.90
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      approach_velocity_scaling_dist: 0.30
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.40
      regulated_linear_scaling_min_speed: 0.22
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.6
      use_rotate_to_heading: false
      allow_reversing: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 15.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[0.21, 0.17], [0.21, -0.17], [-0.21, -0.17], [-0.21, 0.17]]"
      footprint_padding: 0.0
      always_send_full_costmap: true
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: obstacles
        obstacles:
          topic: /nav2_obstacles_360
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 0.30
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.14

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 4.0
      publish_frequency: 4.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.05
      footprint: "[[0.21, 0.17], [0.21, -0.17], [-0.21, -0.17], [-0.21, 0.17]]"
      footprint_padding: 0.0
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: obstacles
        obstacles:
          topic: /nav2_obstacles_360
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 0.30
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
          raytrace_max_range: 6.5
          raytrace_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.18

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.25
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 14.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.10
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.8

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_pre_safety
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 0.80
    base_shift_correction: false
    stop_pub_timeout: 0.4
    polygons: ["StopFront", "SlowFront", "StopRear", "SlowRear"]

    StopFront:
      type: "polygon"
      points: "[[0.26, 0.20], [0.26, -0.20], [0.22, -0.20], [0.22, 0.20]]"
      action_type: "stop"
      min_points: 3
      visualize: true
      polygon_pub_topic: collision_stop_zone
      enabled: true

    SlowFront:
      type: "polygon"
      points: "[[0.40, 0.22], [0.40, -0.22], [0.22, -0.22], [0.22, 0.22]]"
      action_type: "slowdown"
      slowdown_ratio: 0.35
      min_points: 4
      visualize: true
      polygon_pub_topic: collision_slow_zone
      enabled: true

    StopRear:
      type: "polygon"
      points: "[[-0.22, 0.20], [-0.22, -0.20], [-0.26, -0.20], [-0.26, 0.20]]"
      action_type: "stop"
      min_points: 3
      visualize: true
      polygon_pub_topic: collision_stop_zone_rear
      enabled: true

    SlowRear:
      type: "polygon"
      points: "[[-0.22, 0.22], [-0.22, -0.22], [-0.40, -0.22], [-0.40, 0.22]]"
      action_type: "slowdown"
      slowdown_ratio: 0.35
      min_points: 4
      visualize: true
      polygon_pub_topic: collision_slow_zone_rear
      enabled: true

    observation_sources: ["obstacles"]
    obstacles:
      type: "pointcloud"
      topic: /nav2_obstacles_360
      min_height: 0.05
      max_height: 0.30
      enabled: true

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - collision_monitor
